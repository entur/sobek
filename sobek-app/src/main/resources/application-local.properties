#spring.security.oauth2.client.registration.internal.client-id=id
#spring.security.oauth2.client.registration.internal.client-secret=secret

spring.cloud.gcp.pubsub.enabled=false

aspect.enabled=true

netex.valid.codespaces.list={'AKT','ATB','ASH','AVI','BNR','BEF','BOR','BSR','BRA','NYC','COL','TEL','FJT','FLI','FLT','FTR','FLB','OSC','MOR','GFS','GLO','GOA','GOF','HAF','HAV','HUR','HOG','INN','KOL','SOF','OIS','NWY','NOR','NBU','NIA','VIP','RUT','SJV','SJN','SKY','FIN','STB','TID','TRO','TTS','ULR','UNI','VOT','VIL','VKT','VOG','NSB','GJB','VYG','VYB','VYX','OST','ATU'}

server.port=37999

blobstore.gcs.blob.path=exports
blobstore.gcs.bucket.name=sobek-test
blobstore.gcs.project.id=carbon-1287

### rutebanken-storage configurations
# local-disk-blobstore
blobstore.local.container.name=${blobstore.gcs.bucket.name}
# s3-blobstore, for local development with Localstack (see docker-compose.yml)
blobstore.s3.region=eu-north-1
blobstore.s3.access-key-id=dev-access-key-id
blobstore.s3.secret-key=dev-secret-key
blobstore.s3.endpoint-override=http://localhost:37566

# AWS region (required by spring-cloud-aws-secrets-manager autoconfiguration)
spring.cloud.aws.region.static=eu-north-1

security.basic.enabled=false
management.security.enabled=false
authorization.enabled=false
rutebanken.kubernetes.enabled=false

async.export.path=/tmp

publicationDeliveryUnmarshaller.validateAgainstSchema=false
publicationDeliveryStreamingOutput.validateAgainstSchema=false
netex.validPrefix=NMR
netex.profile.version=2.0:NO-NeTEx:2.0
blobstore.local.folder=/tmp/local-gcs-storage/sobek/export

netex.organisations.netex-http-uri=https://api.dev.entur.io/agreements/v1/adapter/transmodel/export?allOrganisations=true
spring.codec.max-in-memory-size=500KB
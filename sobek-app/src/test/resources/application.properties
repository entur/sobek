spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

server.port=0

rutebanken.kubernetes.enabled=false
authorization.enabled=false

# Disable OAuth2/JWT beans - test uses DummyUserinfoExtractor
sobek.security.role.assignment.extractor=none

changelog.publish.enabled=false

spring.cloud.gcp.pubsub.enabled=false

netex.import.enabled.types=MERGE,INITIAL,ID_MATCH,MATCH
netex.validPrefix=NMR
netex.profile.version=1.12:NO-NeTEx-vehicle:1.4

blobstore.local.folder=/tmp/local-gcs-storage/sobek/test-export
async.export.path=/tmp

sobek.oauth2.resourceserver.auth0.entur.internal.jwt.issuer-uri=http://notInUse
sobek.oauth2.resourceserver.auth0.entur.internal.jwt.audience=http://notInUse

publicationDeliveryUnmarshaller.validateAgainstSchema=false
publicationDeliveryStreamingOutput.validateAgainstSchema=false

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.datasource.hikari.maximumPoolSize=10

# Disable AWS Secrets Manager auto-config in tests
spring.cloud.aws.secretsmanager.enabled=false

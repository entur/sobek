logging.level.org.hibernate.tool.hbm2ddl=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=WARN
logging.level.org.springframework=WARN
logging.level.org.rutebanken.sobek=INFO
logging.level.org.rutebanken.sobek.importer=DEBUG
logging.level.org.flywaydb=DEBUG

spring.jpa.database=POSTGRESQL
spring.datasource.url=jdbc:tc:postgis:13-3.3:///sobek?TC_INITSCRIPT=tc-init.sql
spring.datasource.username=sobek

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.jakarta.persistence.query.timeout=15000

spring.datasource.hikari.maximumPoolSize=30

spring.flyway.enabled=true
spring.flyway.table=schema_version

# Disable schema validation (avoids NeTEx XSD download in CI)
publicationDeliveryUnmarshaller.validateAgainstSchema=true
publicationDeliveryStreamingOutput.validateAgainstSchema=true
asyncNetexExport.validateAgainstSchema=true

# Local blob store
blobstore.local.folder=/tmp/local-gcs-storage/sobek/export
async.export.path=/tmp

# Security disabled
authorization.enabled=false
sobek.oauth2.resourceserver.auth0.entur.internal.jwt.issuer-uri=http://notInUse
sobek.oauth2.resourceserver.auth0.entur.internal.jwt.audience=http://notInUse

# AWS S3 config
spring.cloud.aws.region.static=eu-north-1

# Kubernetes disabled
rutebanken.kubernetes.enabled=false

# Import types
netex.import.enabled.types=MERGE,INITIAL,ID_MATCH,MATCH

# Changelog disabled
changelog.publish.enabled=false

# GCP PubSub (required by auto-config even when using local-changelog)
spring.cloud.gcp.pubsub.project-id=test
spring.cloud.gcp.pubsub.emulatorHost=localhost:8089

# Profiles
spring.profiles.active=test,local-blobstore,local-changelog

netex.valid.codespaces.list={'AKT','ATB','ASH','AVI','BNR','BEF','BOR','BSR','BRA','NYC','COL','TEL','FJT','FLI','FLT','FTR','FLB','OSC','MOR','GFS','GLO','GOA','GOF','HAF','HAV','HUR','HOG','INN','KOL','SOF','OIS','NWY','NOR','NBU','NIA','VIP','RUT','SJV','SJN','SKY','FIN','STB','TID','TRO','TTS','ULR','UNI','VOT','VIL','VKT','VOG','NSB','GJB','VYG','VYB','VYX','OST','ATU'}

netex.organisations.netex-file-uri=classpath:/fixtures/organizations-netex-dev.xml